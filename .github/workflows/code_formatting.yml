name: Code Formatting

on:
  pull_request:
  schedule:
    - cron: '39 13 * * *' # run daily

jobs:
  code_formatting:
    runs-on: ubuntu-latest
    steps:

    - name: Runner Info
      run: printenv | sort

    - name: Checkout
      uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0

    - name: Run Clang Format
      run: uvx pre-commit run clang-format --all-files
