name: Build and Publish Containers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '29 13 * * *' # run daily

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-latest
            platform: linux/386
          - os: ubuntu-24.04-arm
            platform: linux/arm64
          - os: ubuntu-24.04-arm
            platform: linux/arm/v6
          - os: ubuntu-24.04-arm
            platform: linux/arm/v7
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:

    - name: Runner Info
      run: printenv | sort

    - name: Prepare
      id: prep
      run: |
        echo "platform_pair=${platform//\//-}" >> $GITHUB_OUTPUT
        echo "repo_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
        # No pull request pushes to the registry: a PR from a fork only gets a
        # read-only GITHUB_TOKEN, so the org package write is denied. PRs build
        # and smoke test locally instead.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "push=false" >> $GITHUB_OUTPUT
        else
          echo "push=true" >> $GITHUB_OUTPUT
        fi
      env:
        platform: ${{ matrix.platform }}

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: '0' # need full history to get version from git tag

    - name: Container metadata
      id: metadata
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ steps.prep.outputs.repo_lowercase }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      if: steps.prep.outputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build image
      id: build
      uses: docker/build-push-action@v7
      with:
        platforms: ${{ matrix.platform }}
        cache-from: type=gha,scope=build-${{ steps.prep.outputs.platform_pair }}
        cache-to: type=gha,mode=max,scope=build-${{ steps.prep.outputs.platform_pair }}
        context: .
        load: ${{ steps.prep.outputs.push != 'true' }}
        tags: ${{ steps.prep.outputs.push != 'true' && 'rtlsdr-airband:ci' || '' }}
        outputs: ${{ steps.prep.outputs.push == 'true' && format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', steps.prep.outputs.repo_lowercase) || '' }}

    # Smoke test the built image: exercises the entrypoint binary and fails on
    # any unresolved runtime library. Runs the matrix platform via QEMU. When
    # pushing, pull the image back to verify the push; otherwise require the
    # locally loaded one so a failed load can't fall back to a stale registry tag.
    - name: Smoke test image
      env:
        image: ${{ steps.prep.outputs.push == 'true' && format('ghcr.io/{0}@{1}', steps.prep.outputs.repo_lowercase, steps.build.outputs.digest) || 'rtlsdr-airband:ci' }}
        pull: ${{ steps.prep.outputs.push == 'true' && '--pull=always' || '--pull=never' }}
      run: |
        docker run --rm "$pull" --platform ${{ matrix.platform }} \
          --entrypoint /app/rtl_airband "$image" -v

    - name: Export digest
      if: steps.prep.outputs.push == 'true'
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload digest
      if: steps.prep.outputs.push == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ steps.prep.outputs.platform_pair }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge:
    # Mirrors the build job's prep.push output; a job-level `if` can't read
    # another job's step outputs. Nothing to merge when nothing was pushed.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:

    - name: Runner Info
      run: printenv | sort

    - name: Prepare
      id: prep
      run: |
        echo "repo_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Container metadata
      id: metadata
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ steps.prep.outputs.repo_lowercase }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create manifest list and push
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
          $(printf 'ghcr.io/${{ steps.prep.outputs.repo_lowercase }}@sha256:%s ' *)

    - name: Inspect image
      run: |
        docker buildx imagetools inspect ghcr.io/${{ steps.prep.outputs.repo_lowercase }}:${{ steps.metadata.outputs.version }}
