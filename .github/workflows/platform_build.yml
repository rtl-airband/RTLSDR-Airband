name: Platform Build

# All self-hosted hardware testing: the airband-proxy runner drives each Pi over
# SSH. See "CI and Pull Request Checks" in CLAUDE.md for the setup and provisioning.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '39 13 * * *' # run daily

jobs:
  platform_build:
    # Never run fork PRs on self-hosted hardware (public repo).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - ssh_host: airband-4b   # 64-bit ARM, native build, no GPU FFT
            platform: native
            bcm_vc: false
            timeout: 35
          - ssh_host: airband-3b   # 32-bit ARM (bookworm), native build + VideoCore FFT
            platform: native
            bcm_vc: true
            timeout: 45

    runs-on: airband-proxy
    timeout-minutes: ${{ matrix.timeout }}
    env:
      SSH_HOST: ${{ matrix.ssh_host }}
      # In /tmp to limit SD card writes; reused across runs while it survives so
      # builds stay warm. Safe only while a single airband-proxy runner exists (it
      # runs one job at a time). Must match the sudoers glob in
      # .github/setup_remote_test_target.
      REMOTE_DIR: /tmp/rtlsdr-airband-ci-${{ matrix.ssh_host }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: '0' # need full history to get version from git tag

    - name: Sync source to ${{ matrix.ssh_host }}
      run: |
        # .git is included so the remote build derives the version from git tags.
        rsync -a --delete --exclude 'builds/' --exclude '.venv/' ./ "$SSH_HOST:$REMOTE_DIR/"

    # Build deps are pre-installed on the target by .github/setup_remote_test_target,
    # so install_dependencies is intentionally not run here (re-provision on change).
    # ssh -tt: if the job is cancelled or times out, the remote pty hangs up and
    # SIGHUP stops the remote build/tests instead of leaving them running.
    # $REMOTE_DIR expands locally; \$ and ~ are left for the remote shell.
    - name: Build on ${{ matrix.ssh_host }}
      run: |
        ssh -tt "$SSH_HOST" "set -euo pipefail
          cd '$REMOTE_DIR'
          cmake -B builds/Release -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=${{ matrix.platform }} \
            ${{ matrix.bcm_vc && '-DBCM_VC=ON' || '-DBCM_VC=OFF' }} \
            -DBUILD_UNITTESTS=TRUE -S .
          VERBOSE=1 cmake --build builds/Release -j\$(nproc)"

    - name: Unit tests on ${{ matrix.ssh_host }}
      run: ssh -tt "$SSH_HOST" "cd '$REMOTE_DIR' && builds/Release/src/unittests"

    - name: Run system tests on ${{ matrix.ssh_host }}
      run: |
        ssh -tt "$SSH_HOST" "set -euo pipefail
          cd '$REMOTE_DIR'
          ~/.local/bin/uv run --no-group dev pytest system_tests/tests/ \
            --binary '$REMOTE_DIR/builds/Release/src/rtl_airband' \
            ${{ matrix.bcm_vc && '--sudo' || '' }} \
            --test-output-dir=/test_data/test_output \
            --generated-input-dir=/test_data/generated_input \
            --generated-input-max-bytes=70M \
            --mode thorough \
            --clean \
            -v"
