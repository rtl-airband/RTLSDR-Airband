# Automatic frequency correction (fork-only). Each channel's received carrier offset is
# measured while its squelch is open; the median across channels, converted to ppm, is applied
# to the dongle's correction every auto_ppm_interval seconds, within hard limits.
# See README.md, "Automatic PPM Correction".
devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 25;
  centerfreq = 120.0;
  correction = 0;          # starting value; auto_ppm adjusts from here
  auto_ppm = true;
  auto_ppm_interval = 30;  # seconds between evaluations, at least 5
  auto_ppm_max_ppm = 100;  # never set a correction beyond +/- this, 1-100
  auto_ppm_max_step = 5;   # largest change in one adjustment
  channels:
  (
    {
      freq = 119.5;
      outputs: ( { type = "file"; directory = "/tmp"; filename_template = "tower"; } );
    },
    {
      freq = 120.225;
      outputs: ( { type = "file"; directory = "/tmp"; filename_template = "approach"; } );
    },
    {
      freq = 120.9;
      outputs: ( { type = "file"; directory = "/tmp"; filename_template = "atis"; } );
    }
  );
});
