# Scan mode with split_on_transmission and split_include_transmission_start.
# Long transmissions are cut every 2 minutes; every part is named
# <template>_<transmission start>_<part start>_<freq>.mp3.
# Refer to https://github.com/rtl-airband/RTLSDR-Airband/wiki
# for description of keywords and config syntax.

devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 25;
  correction = 80;
  mode = "scan";
  channels:
  (
    {
      freqs = ( 118.15, 124.7, 132.1 );
      labels = ( "Tower", "Ground", "Approach" );
      outputs: (
        {
          type = "file";
          directory = "/home/pi/recordings";
          filename_template = "TWR+GND+APP";
          split_on_transmission = true;
          include_freq = true;
          split_max_file_time = 120;
          split_include_transmission_start = true;
        }
      );
    }
  );
 }
);
