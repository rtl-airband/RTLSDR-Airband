# split_on_transmission with split_include_transmission_start.
# A transmission longer than split_max_file_time is cut into several files;
# each of them is named <template>_<transmission start>_<part start>, so the
# parts can be grouped and joined later. Transmissions that fit in one file
# keep the usual <template>_<start> name.
# Refer to https://github.com/rtl-airband/RTLSDR-Airband/wiki
# for description of keywords and config syntax.

# Global default for every split_on_transmission output
split_include_transmission_start = true;
split_max_file_time = 60;

devices:
({
  type = "rtlsdr";
  index = 0;
  gain = 25;
  centerfreq = 120.0;
  correction = 80;
  channels:
  (
    {
      freq = 119.5;
      outputs: (
        {
          # TWR_20260922_101500_20260922_101500.mp3, TWR_20260922_101500_20260922_101601.mp3, ...
          # all parts go in the dated folder of the transmission start
          type = "file";
          directory = "/home/pi/recordings";
          filename_template = "TWR";
          split_on_transmission = true;
          dated_subdirectories = true;
        },
        {
          # raw I/Q parts: join them with
          #   cat TWR_IQ_<transmission start>_*.cf32 > joined.cf32
          type = "rawfile";
          directory = "/home/pi/recordings";
          filename_template = "TWR_IQ";
          split_on_transmission = true;
        }
      );
    },
    {
      freq = 120.225;
      outputs: (
        {
          # per-output override: plain <template>_<start> names only
          type = "file";
          directory = "/home/pi/recordings";
          filename_template = "GND";
          split_on_transmission = true;
          split_include_transmission_start = false;
        }
      );
    }
  );
 }
);
